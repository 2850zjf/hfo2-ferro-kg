version: hfo2-ferrokg-v2.3
name: HfO2-FerroKG Multimodal Evidence Ontology
domain: HfO2-based ferroelectric materials
scope:
  included:
    - HfO2, HZO, and doped hafnia ferroelectric materials
    - thin-film samples, capacitors, FeFETs, FTJs, and related device stacks
    - material-process-phase-property-evidence facts from local PDF literature
    - page-grounded tables, figures, equations, and multimodal observations
  excluded:
    - BaTiO3, PZT, BiFeO3, and non-hafnia ferroelectrics unless used only as context
    - unsupported claims without page-level evidence
source_policy:
  raw_pdfs: local_only
  paid_pdfs_in_git: forbidden
  api_keys_in_code: forbidden
  required_trace_fields:
    - paper_id
    - pdf_id
    - page_number
    - chunk_id
    - evidence_text
    - ontology_version
    - extractor_version

  multimodal_required_trace_fields:
    - paper_id
    - pdf_id
    - page_number
    - source_type
    - asset_id
    - bbox_json
    - model_name
    - ontology_version

node_classes:
  Paper:
    description: A scientific article in the local HfO2 corpus.
    primary_key: paper_id
    fields:
      paper_id: {type: string, required: true}
      doi: {type: string, required: false}
      title: {type: string, required: true}
      authors: {type: string, required: false}
      journal: {type: string, required: false}
      year: {type: integer, required: false}
      paper_type:
        type: enum
        values: [experimental, review, computational, theoretical, dataset, unknown]
        required: true
      is_review: {type: boolean, required: true}

  PDFFile:
    description: A local PDF file and its parse-quality state.
    primary_key: pdf_id
    fields:
      pdf_id: {type: string, required: true}
      file_name: {type: string, required: true}
      file_path: {type: string, required: true}
      sha256: {type: string, required: true}
      page_count: {type: integer, required: false}
      parse_status: {type: string, required: true}
      parse_quality_score: {type: number, required: false}
      ocr_needed: {type: boolean, required: true}

  TableAsset:
    description: A structured or image-derived table grounded to one PDF page.
    primary_key: table_id
    fields:
      table_id: {type: string, required: true}
      paper_id: {type: string, required: true}
      pdf_id: {type: string, required: true}
      page_number: {type: integer, required: true}
      table_index: {type: integer, required: true}
      caption_text: {type: string, required: false}
      table_text: {type: string, required: false}
      row_count: {type: integer, required: false}
      col_count: {type: integer, required: false}
      extraction_method: {type: string, required: true}
      quality_status: {type: string, required: true}

  FigureAsset:
    description: A figure, panel, micrograph, chart, diffraction pattern, or schematic extracted from a PDF page.
    primary_key: asset_id
    fields:
      asset_id: {type: string, required: true}
      paper_id: {type: string, required: true}
      pdf_id: {type: string, required: true}
      page_number: {type: integer, required: true}
      figure_label: {type: string, required: false}
      caption_text: {type: string, required: false}
      image_path: {type: string, required: true}
      bbox_json: {type: string, required: false}
      visual_type:
        type: enum
        values: [plot, hysteresis_loop, diffraction_pattern, micrograph, phase_map, device_schematic, process_schematic, calculation_plot, table_image, other, unknown]
        required: true
      quality_status: {type: string, required: true}

  Equation:
    description: A page-grounded mathematical expression preserved as text, crop, and validated LaTeX when available.
    primary_key: equation_id
    fields:
      equation_id: {type: string, required: true}
      paper_id: {type: string, required: true}
      pdf_id: {type: string, required: true}
      page_number: {type: integer, required: true}
      equation_label: {type: string, required: false}
      raw_text: {type: string, required: false}
      latex_text: {type: string, required: false}
      image_path: {type: string, required: true}
      bbox_json: {type: string, required: true}
      candidate_kind:
        type: enum
        values: [display_equation, inline_equation]
        required: true
      equation_role:
        type: enum
        values: [free_energy, constitutive_relation, kinetics, transport, reliability, device_model, normalization, computational_descriptor, other, unknown]
        required: true
      variables: {type: "list[string]", required: false}
      validation_status: {type: string, required: true}

  VisualObservation:
    description: A model- or human-interpreted observation grounded in a table, figure, or equation asset.
    primary_key: observation_id
    fields:
      observation_id: {type: string, required: true}
      source_asset_id: {type: string, required: true}
      observation_type:
        type: enum
        values: [numeric_value, trend, comparison, phase_evidence, morphology, device_stack, process_condition, mechanism, computational_result, application, other]
        required: true
      description: {type: string, required: true}
      material_ref: {type: string, required: false}
      sample_ref: {type: string, required: false}
      series_or_panel: {type: string, required: false}
      raw_value_text: {type: string, required: false}
      value: {type: number, required: false}
      unit: {type: string, required: false}
      condition: {type: string, required: false}
      value_origin:
        type: enum
        values: [table_cell, axis_label, caption_text, body_text, visual_estimate, equation_symbol, derived, not_applicable, unclear]
        required: true
      evidence_scope:
        type: enum
        values: [primary_experiment, primary_computation, cited_secondary, review_summary, unclear]
        required: true
      confidence: {type: number, required: true, min: 0, max: 1}
      evidence_text: {type: string, required: true}

  HafniaMaterial:
    description: HfO2-based ferroelectric material or composition family.
    primary_key: material_id
    fields:
      canonical_name: {type: string, required: true}
      raw_name: {type: string, required: true}
      formula: {type: string, required: false}
      material_family:
        type: enum
        values: [HfO2, HZO, Si:HfO2, Al:HfO2, La:HfO2, Y:HfO2, Gd:HfO2, Sr:HfO2, mixed_doped_HfO2, unknown_hafnia]
        required: true
      base_material: {type: string, required: true}
      dopant_elements: {type: "list[string]", required: false}
      dopant_concentration: {type: string, required: false}
      zr_fraction: {type: number, required: false, min: 0, max: 1}
      composition_descriptor: {type: string, required: false}
      layer_sequence: {type: string, required: false}
      superlattice_period: {type: string, required: false}
      evidence_text: {type: string, required: true}

  ThinFilmSample:
    description: A concrete sample or device stack reported in one paper.
    primary_key: sample_id
    fields:
      material_ref: {type: string, required: true}
      sample_name: {type: string, required: false}
      film_thickness_nm: {type: number, required: false, min: 0}
      deposition_method: {type: string, required: false}
      substrate: {type: string, required: false}
      top_electrode: {type: string, required: false}
      bottom_electrode: {type: string, required: false}
      device_stack: {type: string, required: false}
      annealing_temperature_c: {type: number, required: false}
      annealing_time_s: {type: number, required: false}
      annealing_atmosphere: {type: string, required: false}
      annealing_method: {type: string, required: false}
      oxygen_partial_pressure: {type: string, required: false}
      oxygen_vacancy_context: {type: string, required: false}
      oxygen_reservoir: {type: string, required: false}
      interface_layer: {type: string, required: false}
      interface_termination: {type: string, required: false}
      growth_orientation: {type: string, required: false}
      strain_state: {type: string, required: false}
      sample_form:
        type: enum
        values: [thin_film, capacitor, FeFET, FTJ, nanolaminate, superlattice, bulk, unknown]
        required: false
      evidence_text: {type: string, required: true}

  Dopant:
    description: Dopant or alloying element that modifies hafnia phase stability.
    primary_key: dopant_id
    fields:
      element: {type: string, required: true}
      concentration: {type: string, required: false}
      evidence_text: {type: string, required: true}

  FabricationProcess:
    description: Deposition and thermal processing conditions.
    primary_key: process_id
    fields:
      deposition_method: {type: string, required: false}
      annealing_method: {type: string, required: false}
      annealing_temperature_c: {type: number, required: false}
      annealing_time_s: {type: number, required: false}
      annealing_atmosphere: {type: string, required: false}
      evidence_text: {type: string, required: true}

  ProcessStep:
    description: An ordered deposition, annealing, interface, patterning, or measurement step.
    primary_key: process_step_id
    fields:
      step_order: {type: integer, required: false}
      step_type:
        type: enum
        values: [deposition, annealing, electrode_deposition, patterning, interface_treatment, measurement, other]
        required: true
      method: {type: string, required: false}
      precursors: {type: "list[string]", required: false}
      temperature_c: {type: number, required: false}
      time_s: {type: number, required: false}
      atmosphere: {type: string, required: false}
      pressure: {type: string, required: false}
      condition: {type: string, required: false}
      evidence_text: {type: string, required: true}

  PhaseStructure:
    description: Crystal phase, space group, and characterization method.
    primary_key: phase_id
    fields:
      phase_name:
        type: enum
        values: [monoclinic, orthorhombic, tetragonal, cubic, rhombohedral, amorphous, mixed, unknown]
        required: true
      space_group: {type: string, required: false}
      phase_fraction: {type: string, required: false}
      crystal_orientation: {type: string, required: false}
      domain_orientation: {type: string, required: false}
      characterization_method: {type: string, required: false}
      evidence_text: {type: string, required: true}

  Electrode:
    description: Top or bottom electrode in a hafnia stack.
    primary_key: electrode_id
    fields:
      material: {type: string, required: true}
      role:
        type: enum
        values: [top, bottom, gate, unknown]
        required: true
      evidence_text: {type: string, required: true}

  Substrate:
    description: Substrate used for film growth or device integration.
    primary_key: substrate_id
    fields:
      material: {type: string, required: true}
      evidence_text: {type: string, required: true}

  Device:
    description: FeCAP, FeFET, FTJ, FeRAM, or related device.
    primary_key: device_id
    fields:
      device_type:
        type: enum
        values: [capacitor, FeCAP, FeFET, FTJ, FeRAM, memristor, ReFET, unknown]
        required: true
      device_stack: {type: string, required: false}
      channel_material: {type: string, required: false}
      gate_stack: {type: string, required: false}
      area: {type: string, required: false}
      evidence_text: {type: string, required: true}

  FerroelectricProperty:
    description: Measured or derived electrical/material property.
    primary_key: property_id
    fields:
      property_name:
        type: enum
        values:
          - remanent_polarization_Pr
          - double_remanent_polarization_2Pr
          - coercive_field_Ec
          - saturation_polarization_Ps
          - dielectric_constant
          - leakage_current_density
          - endurance_cycles
          - retention_time
          - memory_window
          - wake_up
          - fatigue
          - breakdown_field
          - band_gap
          - imprint_voltage
          - dielectric_loss
          - negative_capacitance
          - switched_polarization_fraction
          - polarization_change_DeltaP
          - switching_time
          - on_off_ratio
          - threshold_voltage_shift
          - subthreshold_swing
          - grain_size
          - phase_fraction
          - oxygen_vacancy_concentration
          - vacancy_formation_energy
          - vacancy_migration_barrier
          - phase_energy_difference
          - switching_energy_barrier
          - computed_polarization
          - interface_energy
          - other_hafnia_property
        required: true
      raw_property_name: {type: string, required: true}
      raw_value_text: {type: string, required: false}
      value: {type: number, required: false}
      value_min: {type: number, required: false}
      value_max: {type: number, required: false}
      comparison_operator:
        type: enum
        values: [eq, lt, le, gt, ge, approx, range, unknown]
        required: true
      unit: {type: string, required: false}
      normalized_value: {type: number, required: false}
      normalized_unit: {type: string, required: false}
      measurement_temperature: {type: string, required: false}
      measurement_frequency: {type: string, required: false}
      electric_field: {type: string, required: false}
      measurement_state: {type: string, required: false}
      cycle_number: {type: number, required: false}
      is_reported_value: {type: boolean, required: true}
      is_derived_value: {type: boolean, required: true}
      derivation_rule: {type: string, required: false}
      confidence: {type: number, required: true, min: 0, max: 1}
      evidence_text: {type: string, required: true}

  ReliabilityEvent:
    description: A condition-bound wake-up, fatigue, endurance, retention, imprint, breakdown, recovery, or variability observation.
    primary_key: reliability_event_id
    fields:
      phenomenon:
        type: enum
        values: [wake_up, fatigue, endurance, retention, imprint, breakdown, leakage_degradation, variability, recovery, other]
        required: true
      metric_name: {type: string, required: false}
      initial_value: {type: number, required: false}
      final_value: {type: number, required: false}
      unit: {type: string, required: false}
      cycle_count: {type: number, required: false}
      elapsed_time_s: {type: number, required: false}
      stress_voltage: {type: string, required: false}
      electric_field: {type: string, required: false}
      pulse_width: {type: string, required: false}
      temperature: {type: string, required: false}
      trend: {type: string, required: true}
      failure_mode: {type: string, required: false}
      evidence_text: {type: string, required: true}

  MechanismClaim:
    description: An evidence-scoped causal, correlational, hypothetical, or computed mechanism claim.
    primary_key: mechanism_id
    fields:
      mechanism_type: {type: string, required: true}
      driver: {type: string, required: false}
      outcome: {type: string, required: true}
      affected_entity: {type: string, required: false}
      relation_nature: {type: string, required: true}
      direction: {type: string, required: true}
      confidence: {type: number, required: true, min: 0, max: 1}
      evidence_text: {type: string, required: true}

  ComputationalObservation:
    description: A computed descriptor with enough method and reference-state provenance to reproduce or compare it.
    primary_key: computation_observation_id
    fields:
      method_family: {type: string, required: true}
      code_or_model: {type: string, required: false}
      functional: {type: string, required: false}
      pseudopotential: {type: string, required: false}
      structure_or_phase: {type: string, required: false}
      defect_type: {type: string, required: false}
      charge_state: {type: string, required: false}
      strain: {type: string, required: false}
      electric_field: {type: string, required: false}
      temperature: {type: string, required: false}
      descriptor_name: {type: string, required: true}
      value: {type: number, required: false}
      unit: {type: string, required: false}
      reference_state: {type: string, required: false}
      conclusion: {type: string, required: false}
      evidence_text: {type: string, required: true}

  ApplicationClaim:
    description: A device or application use case and its condition-bound figure of merit.
    primary_key: application_claim_id
    fields:
      device_type: {type: string, required: false}
      application: {type: string, required: true}
      target_metric: {type: string, required: false}
      value: {type: number, required: false}
      unit: {type: string, required: false}
      operating_condition: {type: string, required: false}
      evidence_text: {type: string, required: true}

  Evidence:
    description: Text or multimodal evidence supporting a fact with a resolvable source locator.
    primary_key: evidence_id
    fields:
      paper_id: {type: string, required: true}
      pdf_id: {type: string, required: true}
      chunk_id: {type: string, required: false}
      asset_id: {type: string, required: false}
      bbox_json: {type: string, required: false}
      page_number: {type: integer, required: false}
      evidence_text: {type: string, required: true}
      source_type:
        type: enum
        values: [text, table, figure, figure_caption, equation, page_image, paddleocr_markdown, abstract, metadata, multimodal, manual]
        required: true
      extraction_method:
        type: enum
        values: [rules, llm, hybrid, pdfplumber, pymupdf, paddleocr_vl, qwen_vl, qwen_ocr, manual]
        required: true
      model_name: {type: string, required: false}
      validation_status: {type: string, required: true}
      is_primary_evidence: {type: boolean, required: true}
      confidence: {type: number, required: true, min: 0, max: 1}

relation_classes:
  HAS_PDF: {from: Paper, to: PDFFile}
  HAS_TABLE: {from: PDFFile, to: TableAsset}
  HAS_FIGURE: {from: PDFFile, to: FigureAsset}
  HAS_EQUATION: {from: PDFFile, to: Equation}
  HAS_VISUAL_OBSERVATION: {from: FigureAsset, to: VisualObservation}
  TABULATES_OBSERVATION: {from: TableAsset, to: VisualObservation}
  DEFINES_OBSERVATION: {from: Equation, to: VisualObservation}
  REPORTS: {from: Paper, to: HafniaMaterial}
  HAS_SAMPLE: {from: HafniaMaterial, to: ThinFilmSample}
  HAS_DOPANT: {from: HafniaMaterial, to: Dopant}
  FABRICATED_BY: {from: ThinFilmSample, to: FabricationProcess}
  HAS_PROCESS_STEP: {from: ThinFilmSample, to: ProcessStep}
  NEXT_STEP: {from: ProcessStep, to: ProcessStep}
  HAS_TOP_ELECTRODE: {from: ThinFilmSample, to: Electrode}
  HAS_BOTTOM_ELECTRODE: {from: ThinFilmSample, to: Electrode}
  ON_SUBSTRATE: {from: ThinFilmSample, to: Substrate}
  HAS_PHASE: {from: ThinFilmSample, to: PhaseStructure}
  USED_IN: {from: ThinFilmSample, to: Device}
  HAS_PROPERTY: {from: ThinFilmSample, to: FerroelectricProperty}
  HAS_RELIABILITY_EVENT: {from: ThinFilmSample, to: ReliabilityEvent}
  EXPLAINED_BY: {from: ThinFilmSample, to: MechanismClaim}
  HAS_COMPUTED_DESCRIPTOR: {from: HafniaMaterial, to: ComputationalObservation}
  TARGETS_APPLICATION: {from: ThinFilmSample, to: ApplicationClaim}
  MODULATES: {from: FabricationProcess, to: FerroelectricProperty}
  STABILIZES: {from: MechanismClaim, to: PhaseStructure}
  DESTABILIZES: {from: MechanismClaim, to: PhaseStructure}
  VALIDATED_BY: {from: MechanismClaim, to: ComputationalObservation}
  CONTRADICTS: {from: Evidence, to: Evidence}
  SUPPORTED_BY: {from: FerroelectricProperty, to: Evidence}
  FROM_PAPER: {from: Evidence, to: Paper}
  COMPARED_WITH: {from: FerroelectricProperty, to: FerroelectricProperty}
  DOCUMENTS_SAMPLE: {from: FigureAsset, to: ThinFilmSample}
  TABULATES_PROPERTY: {from: TableAsset, to: FerroelectricProperty}
  DEFINES_DESCRIPTOR: {from: Equation, to: ComputationalObservation}
  SUPPORTED_BY_VISUAL: {from: MechanismClaim, to: VisualObservation}

controlled_vocabularies:
  deposition_methods: [ALD, sputtering, PLD, CSD, sol-gel, MOCVD, unknown]
  annealing_methods: [RTA, PMA, PDA, furnace, microwave, laser, unknown]
  annealing_atmospheres: [N2, O2, Ar, forming_gas, vacuum, air, unknown]
  common_electrodes: [TiN, W, Pt, Ru, RuO2, ITO, TaN, Ir, IrO2, Al, Au]
  characterization_methods: [XRD, GIXRD, TEM, STEM, SAED, PFM, XPS, Raman, electrical]

property_normalization:
  remanent_polarization_Pr:
    canonical_unit: "\u03bcC/cm\u00b2"
    aliases: [Pr, P_r, remanent polarization]
    abnormal_if_gt: 100
    notes: Do not merge with 2Pr.
  double_remanent_polarization_2Pr:
    canonical_unit: "\u03bcC/cm\u00b2"
    aliases: [2Pr, 2P_r, double remanent polarization]
    abnormal_if_gt: 200
    derivable:
      target: remanent_polarization_Pr
      rule: Pr = 2Pr / 2
      requires_explicit_derivation_flag: true
  coercive_field_Ec:
    canonical_unit: MV/cm
    aliases: [Ec, E_c, coercive field]
    abnormal_if_gt: 10
  leakage_current_density:
    canonical_unit: A/cm\u00b2
    aliases: [leakage, leakage current density]
  endurance_cycles:
    canonical_unit: cycles
    aliases: [endurance, cycling endurance]
  retention_time:
    canonical_unit: s
    aliases: [retention]
  memory_window:
    canonical_unit: V
    aliases: [memory window]
  negative_capacitance:
    canonical_unit: "μF/cm²"
    aliases: [negative capacitance, NC capacitance]
  switched_polarization_fraction:
    canonical_unit: fraction
    aliases: [switched polarization fraction, polarization switching fraction]
  polarization_change_DeltaP:
    canonical_unit: "μC/cm²"
    aliases: [polarization change, DeltaP, ΔP]

extraction_contract:
  chunk_selection:
    send_to_llm_if_any:
      - contains_hfo2_keyword
      - contains_property_keyword
      - contains_process_keyword
      - contains_table
    avoid_sections: [references]
  required_for_property_candidate:
    - property_name
    - raw_property_name
    - value_or_state
    - unit_when_numeric
    - material_ref
    - evidence_text
    - paper_id
    - pdf_id
    - page_number_or_chunk_id
    - confidence
  strict_rules:
    - Never convert 2Pr into Pr unless a derived fact is explicitly created.
    - Never enter unsupported facts into reviewed_facts without evidence_text.
    - Treat values from review articles as secondary until manually verified.
    - Keep raw value, raw unit, normalized value, normalized unit, and evidence.
    - Mark figure-estimated values and ambiguous sample-property links as needs_human_review.
    - Keep raw table cells, original figure crops, and equation crops even when semantic extraction fails.
    - Never treat a figure trend, table value, or equation variable as a fact without its asset ID and page number.
    - Separate primary experiment, primary computation, cited secondary evidence, and review summaries.

review_statuses:
  pending: Candidate created but not yet preaudited.
  preapproved_machine: Machine preaudit passed; still needs later human confirmation for publication.
  needs_human_review: Evidence, unit, sample linkage, or value range needs human review.
  approved: Human-approved final fact.
  rejected: Human-rejected fact.

workflow_order:
  - 00_build_ontology
  - 01_build_manifest
  - 02_parse_pdfs
  - 03_extract_tables
  - 15_extract_visual_assets
  - 58_link_visual_assets
  - 55_extract_equation_assets
  - 04_chunk_documents
  - 56_build_multimodal_queue
  - 57_extract_multimodal_semantics
  - 05_run_extraction
  - 06_normalize_facts
  - 07_build_graph
  - 08_build_hybrid_vector_index
  - 29_build_benchmark_tiers
  - 09_export_reports
  - 10_validate_results
